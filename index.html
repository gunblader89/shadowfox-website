<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShadowFox — Blackmoore EU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090d; --elev:#0f1116; --panel:#12151c; --panel2:#171b24; --panel3:#1c212c;
  --line:#222836; --line2:#2c3444;
  --tx:#eaedf3; --tx2:#a2abbc; --tx3:#69738a;
  --amber:#eab54e; --amber-d:#c98f2e; --amber-bg:rgba(234,181,78,.11);
  --violet:#8f7ce8; --violet-bg:rgba(143,124,232,.12);
  --green:#5ec48f; --green-bg:rgba(94,196,143,.1);
  --blue:#6b9ce8; --blue-bg:rgba(107,156,232,.11);
  --red:#e26b6b;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(880px 480px at 82% -10%,rgba(234,181,78,.075),transparent 62%),
             radial-gradient(720px 440px at 6% 2%,rgba(143,124,232,.07),transparent 64%)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
.wrap{max-width:1120px;margin:0 auto;padding:0 26px;position:relative;z-index:1}

.top{position:sticky;top:0;z-index:60;background:rgba(8,9,13,.86);backdrop-filter:blur(18px) saturate(150%);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:24px;height:64px}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.brand .mark{width:36px;height:36px;flex-shrink:0}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.brand span{display:block;font-size:11px;color:var(--tx3);letter-spacing:.4px;font-weight:500}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:8px 11px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--tx2);white-space:nowrap;transition:.14s}
nav a:hover{color:var(--tx);background:var(--panel)}
nav a.on{color:var(--tx);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:9px;flex-shrink:0}
.sbtn{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--tx3);font-size:13px;transition:.14s}
.sbtn:hover{border-color:var(--line2);color:var(--tx2)}
kbd{font-family:var(--mono);font-size:10.5px;padding:2px 5px;border-radius:5px;background:#1b202a;border:1px solid #2b3242;color:var(--tx3)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:600;transition:.14s;border:1px solid transparent;white-space:nowrap}
.btn-p{background:var(--amber);color:#1a1305}
.btn-p:hover{background:#f2c266}

.notice{background:var(--green-bg);border-bottom:1px solid rgba(94,196,143,.2);font-size:12px;color:var(--green);text-align:center;padding:7px 20px}
main{padding:36px 0 90px}

.page-h{margin-bottom:26px}
.page-h h1{font-size:29px;font-weight:700;letter-spacing:-.8px;line-height:1.15}
.page-h p{font-size:14.5px;color:var(--tx2);margin-top:7px;max-width:660px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx3);margin-bottom:11px}
h2.sec{font-size:19px;font-weight:650;letter-spacing:-.4px;margin-bottom:4px}
.sec-sub{font-size:13.5px;color:var(--tx3);margin-bottom:16px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.grid{display:grid;gap:13px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.muted{color:var(--tx3)}.soft{color:var(--tx2)}
.mono{font-family:var(--mono);font-size:12.5px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.3px;padding:3px 9px;border-radius:100px;border:1px solid}
.p-green{color:var(--green);border-color:rgba(94,196,143,.3);background:var(--green-bg)}
.p-amber{color:var(--amber);border-color:rgba(234,181,78,.32);background:var(--amber-bg)}
.p-violet{color:var(--violet);border-color:rgba(143,124,232,.32);background:var(--violet-bg)}
.p-blue{color:var(--blue);border-color:rgba(107,156,232,.3);background:var(--blue-bg)}
.p-gray{color:var(--tx3);border-color:var(--line2);background:var(--panel2)}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor}

.hero{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:linear-gradient(145deg,#171b26 0%,#101319 52%,#0b0d12 100%);position:relative;margin-bottom:16px}
.hero::after{content:"";position:absolute;right:-120px;top:-160px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(234,181,78,.14),transparent 66%);pointer-events:none}
.hero-in{padding:34px;position:relative;z-index:1;display:flex;gap:32px;align-items:center;flex-wrap:wrap}
.hero-mark{width:96px;height:96px;flex-shrink:0}
.hero h1{font-size:42px;font-weight:800;letter-spacing:-1.4px;line-height:1;margin-bottom:9px}
.hero .sub{font-size:14.5px;color:var(--tx2);max-width:520px}
.hero-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.chip{font-size:12.5px;padding:5px 11px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line2);color:var(--tx2)}
.chip b{color:var(--tx);font-weight:650}

.progblock{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);width:100%}
.progrow{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.progrow:last-child{margin-bottom:0}
.progrow .lbl{width:78px;flex-shrink:0;font-size:12px;font-weight:650;color:var(--tx2)}
.track{flex:1;height:8px;border-radius:100px;background:#1a1e28;overflow:hidden;min-width:80px}
.fill{display:block;height:100%;border-radius:100px}
.progrow .val{width:66px;text-align:right;flex-shrink:0;font-family:var(--mono);font-size:12px;color:var(--tx)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{display:block;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:13px;transition:.16s}
.tile:hover{border-color:var(--line2);background:var(--panel2);transform:translateY(-2px)}
.tile .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--panel3);border:1px solid var(--line2);font-size:16px;margin-bottom:12px}
.tile b{display:block;font-size:14px;font-weight:650;margin-bottom:3px}
.tile span{display:block;font-size:12.5px;color:var(--tx3);line-height:1.45}

.boss{background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-bottom:9px;overflow:hidden;transition:.16s}
.boss.open{border-color:var(--line2);background:var(--panel2)}
.bhead{display:flex;align-items:center;gap:14px;padding:15px 18px;width:100%}
.bnum{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;font-family:var(--mono);font-size:12px;background:#1a1f29;border:1px solid var(--line2);color:var(--tx3)}
.boss.open .bnum{background:var(--amber-bg);border-color:rgba(234,181,78,.3);color:var(--amber)}
.bname{flex:1;min-width:0}
.bname b{display:block;font-size:15px;font-weight:650;letter-spacing:-.2px}
.bname span{display:block;font-size:12.5px;color:var(--tx3)}
.chev{color:var(--tx3);transition:.2s;flex-shrink:0}
.boss.open .chev{transform:rotate(180deg)}
.bbody{display:none;padding:4px 18px 20px 62px}
.boss.open .bbody{display:block}
.bintro{font-size:13.5px;color:var(--tx2);padding:14px 16px;background:rgba(255,255,255,.022);border-left:2px solid var(--amber);border-radius:0 8px 8px 0;margin-bottom:18px}
.blabel{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;color:var(--tx3);font-weight:700;margin:18px 0 10px}
.steps{list-style:none;display:flex;flex-direction:column;gap:9px}
.step{display:flex;gap:11px;align-items:flex-start}
.rtag{flex-shrink:0;width:60px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.5px;padding:3px 0;border-radius:6px;margin-top:2px;text-transform:uppercase}
.r-alle{background:var(--panel3);color:var(--tx3);border:1px solid var(--line2)}
.r-tanks{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(107,156,232,.28)}
.r-heiler{background:var(--green-bg);color:var(--green);border:1px solid rgba(94,196,143,.28)}
.r-dps{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(234,181,78,.28)}
.step p{font-size:13.5px;color:var(--tx2);line-height:1.55}
.abils{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.abil{font-size:11.5px;padding:3px 9px;border-radius:7px;background:#1a1f29;border:1px solid var(--line);color:var(--tx3);font-family:var(--mono)}
.links{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.lchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:550;padding:7px 12px;border-radius:9px;background:#1a1f29;border:1px solid var(--line2);color:var(--tx2);transition:.14s}
.lchip:hover{border-color:#3d4658;color:var(--tx);background:#20262f}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table.trk{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
table.trk th{position:sticky;top:0;background:var(--panel2);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);font-weight:700;padding:12px 11px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
table.trk th:hover{color:var(--tx2)}
table.trk th.act{color:var(--amber)}
table.trk th .ar{opacity:.5;font-size:9px;margin-left:3px}
table.trk td{padding:11px 11px;border-bottom:1px solid var(--line);color:var(--tx2);white-space:nowrap}
table.trk tr:last-child td{border-bottom:none}
table.trk tbody tr:hover td{background:rgba(255,255,255,.02)}
.pname{display:flex;align-items:center;gap:9px}
.pdot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.pname b{color:var(--tx);font-weight:650;font-size:13px}
.pname i{font-style:normal;font-size:11px;color:var(--tx3);display:block}
.num{font-family:var(--mono);font-size:12.5px;color:var(--tx)}
.mini{height:6px;border-radius:100px;background:#1a1e28;overflow:hidden;width:56px;display:inline-block;vertical-align:middle;margin-right:8px}
.mini i{display:block;height:100%;border-radius:100px}
.vault{display:inline-flex;gap:3px}
.vslot{width:15px;height:15px;border-radius:4px;border:1px solid var(--line2);background:#171b24}
.vslot.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 8px rgba(234,181,78,.3)}
.amp{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650}
.amp .b{width:8px;height:8px;border-radius:50%}
.a-ok .b{background:var(--green)}.a-ok{color:var(--green)}
.a-warn .b{background:var(--amber)}.a-warn{color:var(--amber)}
.a-bad .b{background:var(--red)}.a-bad{color:var(--red)}

.rank{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;background:var(--panel);border:1px solid var(--line);margin-bottom:6px;transition:.14s}
.rank:hover{border-color:var(--line2)}
.rank .pos{width:22px;font-family:var(--mono);font-size:12px;color:var(--tx3);flex-shrink:0;text-align:right}
.rank .nm{flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rank .vl{font-family:var(--mono);font-size:12.5px;color:var(--tx);flex-shrink:0}
.rank.top .pos{color:var(--amber);font-weight:700}

.sig-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.sig-counts{display:flex;gap:9px;flex-wrap:wrap}
.cnt{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:8px;border:1px solid}
.c-yes{color:var(--green);border-color:rgba(94,196,143,.3);background:var(--green-bg)}
.c-tent{color:var(--amber);border-color:rgba(234,181,78,.3);background:var(--amber-bg)}
.c-no{color:var(--red);border-color:rgba(226,107,107,.3);background:rgba(226,107,107,.1)}
.c-bench{color:var(--tx3);border-color:var(--line2);background:var(--panel2)}
.sig-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.sig-col h4{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.sig-p{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);margin-bottom:5px;font-size:12.5px}
.sig-p .d{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.sig-p .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sig-p .s{font-size:10.5px;color:var(--tx3);flex-shrink:0}

.logcard{border:1px solid var(--line2);border-radius:16px;overflow:hidden;background:linear-gradient(140deg,#181c26,#101319)}
.logcard-t{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logcard-b{padding:18px 20px}

.rcards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.rcard{display:flex;gap:14px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:13px;transition:.16s}
.rcard:hover{border-color:var(--line2);background:var(--panel2)}
.rav{width:42px;height:42px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;font-size:16px;font-weight:800;color:#0a0b0f}
.rcard .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.rcard .hd b{font-size:14.5px;font-weight:650}
.rcard .hd em{font-style:normal;font-size:11.5px;color:var(--tx3)}
.rcard p{font-size:12.5px;color:var(--tx3);line-height:1.5;margin-top:4px}
.kbtag{font-size:10.5px;padding:2px 8px;border-radius:6px;background:#1a1f29;color:var(--tx3);border:1px solid var(--line)}

.clsrow{display:flex;align-items:center;gap:12px;margin-bottom:7px}
.clsrow .n{width:118px;flex-shrink:0;font-size:13px;font-weight:550}
.clsrow .bar{flex:1;height:22px;border-radius:6px;background:#161a23;overflow:hidden;position:relative}
.clsrow .bf{display:block;height:100%;border-radius:6px;opacity:.85}
.clsrow .c{width:32px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--tx2);flex-shrink:0}

.kbcard{padding:19px;background:var(--panel);border:1px solid var(--line);border-radius:13px}
.kbcard h3{font-size:14.5px;font-weight:650;margin-bottom:6px;display:flex;align-items:center;gap:9px}
.kbcard p{font-size:13px;color:var(--tx3);line-height:1.55}

.ovl{position:fixed;inset:0;z-index:100;display:none;background:rgba(5,6,9,.7);backdrop-filter:blur(7px);padding:10vh 20px 20px}
.ovl.on{display:block}
.sbox{max-width:640px;margin:0 auto;background:var(--elev);border:1px solid var(--line2);border-radius:17px;box-shadow:0 26px 80px rgba(0,0,0,.65);overflow:hidden}
.sbox-t{display:flex;align-items:center;gap:12px;padding:17px 19px;border-bottom:1px solid var(--line)}
.sbox input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-size:16px;font-family:inherit}
.sbox input::placeholder{color:var(--tx3)}
.results{max-height:54vh;overflow-y:auto;padding:8px}
.res{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;cursor:pointer;transition:.1s}
.res:hover,.res.sel{background:var(--panel2)}
.res .ic{width:29px;height:29px;border-radius:8px;background:var(--panel);border:1px solid var(--line2);display:grid;place-items:center;font-size:13px;flex-shrink:0}
.res .tx{flex:1;min-width:0}
.res .tx b{display:block;font-size:13.5px;font-weight:600}
.res .tx span{display:block;font-size:12px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .cat{font-size:10.5px;color:var(--tx3);font-family:var(--mono);flex-shrink:0}
.sbox-f{display:flex;gap:16px;padding:11px 19px;border-top:1px solid var(--line);font-size:11.5px;color:var(--tx3)}
.empty{padding:36px 20px;text-align:center;color:var(--tx3);font-size:13.5px}

footer{border-top:1px solid var(--line);padding:28px 0;color:var(--tx3);font-size:12.5px}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;align-items:center}
.fade{animation:f .34s ease}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media(max-width:940px){ .g4,.g3,.tiles{grid-template-columns:repeat(2,1fr)} .top-in{height:auto;flex-wrap:wrap;padding:12px 0;gap:12px} nav{order:3;width:100%} .hero h1{font-size:32px}.hero-in{padding:24px;gap:20px}.hero-mark{width:68px;height:68px} .wrap{padding:0 16px} .bbody{padding-left:18px} .sig-grid{grid-template-columns:repeat(2,1fr)} .rcards{grid-template-columns:1fr} }
@media(max-width:580px){ .g4,.g3,.g2,.tiles{grid-template-columns:1fr} .sbtn span{display:none} .rtag{width:52px} .clsrow .n{width:92px;font-size:12px} .sig-grid{grid-template-columns:1fr} }
</style>
</head>

  });
  tb.innerHTML=rows.map(p=>`<tr>
    <td><span class="pname"><span class="pdot" style="background:${col(p.c)}"></span>
      <span><b>${esc(p.n)}</b><i>${esc(p.c)}</i></span></span></td>
    <td><span style="color:${ROLLEN[p.r]||'#888'};font-weight:600;font-size:12px">${p.r}</span></td>
    <td><span class="mini"><i style="width:${Math.round(((p.ilvl||0)/maxI)*100)}%;background:${col(p.c)}"></i></span><span class="num">${p.ilvl||'—'}</span></td>
    <td><span class="mini"><i style="width:${Math.round(((p.mp||0)/Math.max(maxM,1))*100)}%;background:var(--violet)"></i></span><span class="num">${p.mp||0}</span></td>
    <td><span class="num" style="color:${(p.mr||0)<4?'var(--amber)':'var(--tx)'}">${p.mr||0} / 8</span></td>
    <td><span class="vault">${[0,1,2].map(i=>`<span class="vslot${i<(p.v||0)?' on':''}"></span>`).join("")}</span></td>
    <td><span class="num" style="color:${(p.att||0)<80?'var(--red)':(p.att||0)<90?'var(--amber)':'var(--green)'}">${p.att!=null?p.att+'%':'—'}</span></td>
    <td>${p.wl?'<span style="color:var(--green)">✓</span>':'<span style="color:var(--red)">✕</span>'}</td>
    <td>${ampel(p)}</td></tr>`).join("");
  document.querySelectorAll("#trk th[data-k]").forEach(th=>{
    const on=th.dataset.k===sortKey;
    th.classList.toggle("act",on);
    const ar=th.querySelector(".ar");
    if(on&&!ar) th.insertAdjacentHTML("beforeend",` <span class="ar">${sortDir<0?"▼":"▲"}</span>`);
    else if(on&&ar) ar.textContent=sortDir<0?"▼":"▲";
    else if(ar) ar.remove();
  });
}
function bindTrk(){
  document.querySelectorAll("#trk th[data-k]").forEach(th=>{
    th.onclick=()=>{
      const k=th.dataset.k;
      if(k===sortKey) sortDir*=-1; else {sortKey=k; sortDir=-1;}
      renderTrk();
    };
  });
  renderTrk();
}

const CLS_DE={Warrior:"Krieger",Paladin:"Paladin",Hunter:"Jäger",Rogue:"Schurke",Priest:"Priester","Death Knight":"Todesritter",Shaman:"Schamane",Mage:"Magier",Warlock:"Hexenmeister",Monk:"Mönch",Druid:"Druide","Demon Hunter":"Dämonenjäger",Evoker:"Rufer"};

async function load(path){
  try{
    const r=await fetch(`${path}?t=${Date.now()}`,{cache:"no-cache"});
    if(!r.ok) return null;
    return await r.json();
  }catch{ return null; }
}

function mapRole(roleStr, clsStr, specStr){
  const s=(String(clsStr||"")+" "+String(roleStr||"")+" "+String(specStr||"")).toLowerCase();
  if(s.includes("tank")||s.includes("guardian")||s.includes("brewmaster")||s.includes("blood")||s.includes("protection")) return "Tank";
  if(s.includes("heal")||s.includes("restoration")||s.includes("holy")||s.includes("mistweaver")||s.includes("discipline")||s.includes("preservation")) return "Heal";
  if(s.includes("melee")||s.includes("fury")||s.includes("arms")||s.includes("retribution")||s.includes("unholy")||s.includes("frost1")||s.includes("havoc")||s.includes("windwalker")||s.includes("assassination")||s.includes("outlaw")||s.includes("subtlety")||s.includes("feral")||s.includes("survival")||s.includes("enhancement")) return "Melee";
  return "Ranged";
}

function resolveClass(spec, cls, name){
  const cleanSpec = String(spec||"").toLowerCase();
  if(SPEC_MAP[cleanSpec]) return SPEC_MAP[cleanSpec];
  const target = normName(name);
  const k = KADER.find(p => normName(p.n) === target);
  if(k) return k.c;
  return CLS_DE[cls] || cls || "Krieger";
}

function applyData(d){
  const charMap = new Map();

  // 1. WoWAudit als primäre Quelle (Echtes Itemlevel & Wunschlisten)
  if(d.wowaudit?.characters?.length){
    for(const wc of d.wowaudit.characters){
      const key = normName(wc.name);
      charMap.set(key, {
        n: wc.name,
        c: CLS_DE[wc.class] || wc.class,
        r: mapRole(wc.role, wc.class, wc.spec),
        ilvl: wc.equipped_item_level || wc.item_level || wc.ilvl || null,
        mp: 0,
        mr: 0,
        v: 0,
        att: null,
        wl: wc.wishes_count != null ? (wc.wishes_count > 0 ? 1 : 0) : (wc.wishlist != null ? (wc.wishlist ? 1 : 0) : 1),
        spec: wc.spec || ""
      });
    }
  }

  // 2. WoWAudit Anwesenheit
  if(d.wowaudit?.attendance){
    const attList = Array.isArray(d.wowaudit.attendance) ? d.wowaudit.attendance : (d.wowaudit.attendance.characters || []);
    for(const a of attList){
      const key = normName(a.name || a.character_name);
      const p = charMap.get(key);
      if(p && a.attendance != null){
        p.att = typeof a.attendance === "number" && a.attendance <= 1 ? Math.round(a.attendance * 100) : Math.round(a.attendance);
      }
    }
  }

  // 3. Raider.IO Scores & Wochenruns
  if(d.roster?.characters?.length){
    for(const rc of d.roster.characters){
      const key = normName(rc.name);
      let p = charMap.get(key);
      if(!p){
        const runs = rc.weeklyRuns || 0;
        p = { n: rc.name, c: CLS_DE[rc.class]||rc.class, r: mapRole(rc.role, rc.class, rc.spec), ilvl: rc.ilvl, mp: rc.mplus||0, mr: runs, v: calcVault(runs), att: null, wl: 1, spec: rc.spec||"" };
        charMap.set(key, p);
      } else {
        if(rc.ilvl && !p.ilvl) p.ilvl = rc.ilvl;
        if(rc.mplus != null) p.mp = rc.mplus;
        if(rc.weeklyRuns != null) {
          p.mr = Math.max(p.mr || 0, rc.weeklyRuns);
          p.v = calcVault(p.mr);
        }
        if(rc.spec && !p.spec) p.spec = rc.spec;
      }
    }
  }

  // 4. Blizzard Keys (Zusätzlicher Sync)
  if(d.blizzard?.weeklyKeys?.length){
    for(const bk of d.blizzard.weeklyKeys){
      const key = normName(bk.name);
      const p = charMap.get(key);
      if(p && bk.runsThisWeek != null){
        p.mr = Math.max(p.mr || 0, bk.runsThisWeek);
        p.v = calcVault(p.mr);
      }
    }
  }

  KADER = Array.from(charMap.values());

  // 5. Raid-Helper Signups
  if(d.events?.events?.length){
    const e = d.events.events[0];
    EVENT.title = e.title || EVENT.title;
    EVENT.time = e.time || EVENT.time;
    EVENT.leader = e.leader || EVENT.leader;
    EVENT.dateLabel = e.date ? `${e.date.split("-")[0]}.${e.date.split("-")[1]}.` : "Montag 24.08.";
    EVENT.counts = e.counts || {primary:0,tentative:0,bench:0,absence:0,late:0};
    EVENT.signups = (e.signups||[]).map(s=>{
      const isAbs = String(s.role||s.cls).toLowerCase().includes("abs");
      const pClass = resolveClass(s.spec, s.cls, s.name);
      return {
        name: s.name,
        cls: pClass,
        spec: s.spec || "",
        role: mapRole(s.role, s.cls, s.spec),
        status: isAbs ? "absence" : "primary"
      };
    });
    EVENT.live = true;
  }

  // 6. Warcraft Logs
  if(d.logs?.reports?.length){
    REPORTS = d.logs.reports.map((r, i)=>({
      code: r.code,
      t: r.zone || r.title || "Der Giftige Abgrund",
      d: r.date || "Letzter Raidabend",
      diff: r.difficulty || "Normal",
      dur: r.duration || "—",
      kills: r.kills || 0,
      wipes: r.wipes || 0,
      killedBosses: r.killedBosses || [],
      live: i === 0,
      url: r.url || G.links.wcl
    }));
  }
}

document.getElementById("nav").innerHTML=NAV.map(([k,l])=>`<a href="#/${k}" data-k="${k}">${l}</a>`).join("");
function route(){
  const k=location.hash.replace("#/","")||"start";
  document.getElementById("view").innerHTML=(views[k]||views.start)();
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.k===k));
  document.querySelectorAll(".kk").forEach(e=>e.textContent=KEY);
  if(k==="tracker") bindTrk();
  window.scrollTo({top:0,behavior:"instant"});
}
addEventListener("hashchange",route);

let INDEX=[];
function buildIndex(){
  INDEX=[
    ...BOSSES.flatMap((b,i)=>[
      {i:"🎯",t:b.n,s:`Boss ${i+1} · ${b.role}`,c:"Boss",h:"#/raid",k:`${b.n} ${b.en} boss`},
      ...(b.pts||[]).map(([r,tx])=>({i:"📝",t:tx,s:`${r} — ${b.n}`,c:"Taktik",h:"#/raid",k:`${tx} ${b.n}`}))
    ]),
    ...KADER.map(p=>({i:"👤",t:p.n,s:`${p.c} · ${p.r}`,c:"Kader",h:"#/roster",k:`${p.n} ${p.c} ${p.r} raider`})),
    ...KB.map(k=>({i:k.i,t:k.t,s:k.d,c:"Wissen",h:"#/wissen",k:`${k.t} ${k.d}`})),
    ...TERMINE.map(t=>({i:"📅",t:`${t.d}, ${t.dt}`,s:`${t.t} · ${t.n}`,c:"Termin",h:"#/termine",k:`${t.d} ${t.dt} raid termin`}))
  ];
}

const ovl=document.getElementById("ovl"),q=document.getElementById("q"),rb=document.getElementById("results");
let sel=0,hits=[];
function openS(){ovl.classList.add("on");q.value="";q.focus();draw("");}
function closeS(){ovl.classList.remove("on");}
document.getElementById("openS").onclick=openS;
ovl.onclick=e=>{if(e.target===ovl)closeS();};
function draw(term){
  const t=term.trim().toLowerCase();
  hits=!t?INDEX.slice(0,6):INDEX.filter(x=>x.k.toLowerCase().includes(t)).slice(0,16);
  sel=0;
  if(!hits.length){rb.innerHTML=`<div class="empty">Nichts gefunden für „${esc(term)}“.</div>`;return;}
  rb.innerHTML=(!t?`<div class="eyebrow" style="padding:9px 12px 4px;margin:0">Schnellsuche</div>`:"")+
    hits.map((h,i)=>`<div class="res${i===0?' sel':''}" data-i="${i}">
      <span class="ic">${h.i}</span>
      <span class="tx"><b>${esc(h.t)}</b><span>${esc(h.s)}</span></span>
      <span class="cat">${h.c}</span></div>`).join("");
  rb.querySelectorAll(".res").forEach(el=>el.onclick=()=>go(+el.dataset.i));
}
function go(i){if(!hits[i])return;location.hash=hits[i].h;closeS();}
function move(d){if(!hits.length)return;sel=(sel+d+hits.length)%hits.length;
  rb.querySelectorAll(".res").forEach((el,i)=>el.classList.toggle("sel",i===sel));
  const c=rb.querySelector(".res.sel");if(c)c.scrollIntoView({block:"nearest"});}
q.addEventListener("input",e=>draw(e.target.value));
addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();ovl.classList.contains("on")?closeS():openS();return;}
  if(!ovl.classList.contains("on"))return;
  if(e.key==="Escape")closeS();
  else if(e.key==="ArrowDown"){e.preventDefault();move(1);}
  else if(e.key==="ArrowUp"){e.preventDefault();move(-1);}
  else if(e.key==="Enter"){e.preventDefault();go(sel);}
});

(async function boot(){
  const dnames=["guild","roster","events","logs","wowaudit","blizzard","status"];
  const d=await Promise.all(dnames.map(n=>load(`data/${n}.json`)))
    .then(a=>Object.fromEntries(dnames.map((n,i)=>[n,a[i]])));
  applyData(d);
  buildIndex();
  route();
})();
</script>
