<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShadowFox — Blackmoore EU</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- Wowhead Tooltips Script -->
<script>const whTooltips = {colorLinks: true, iconizeLinks: true, renameLinks: false};</script>
<script src="https://wow.zamimg.com/js/power.js"></script>
<style>
:root{
  --bg:#06070a; --elev:#0f1116; --panel:#11141b; --panel2:#161a23; --panel3:#1b202c;
  --line:#1f2533; --line2:#2a3245;
  --tx:#eaedf3; --tx2:#a2abbc; --tx3:#69738a;
  --amber:#eab54e; --amber-d:#c98f2e; --amber-bg:rgba(234,181,78,.11);
  --violet:#8f7ce8; --violet-bg:rgba(143,124,232,.12);
  --green:#5ec48f; --green-bg:rgba(94,196,143,.1);
  --blue:#6b9ce8; --blue-bg:rgba(107,156,232,.11);
  --red:#e26b6b; --red-bg:rgba(226,107,107,.1);
  --disc:#5865f2; --disc-bg:rgba(88,101,242,.15);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}

body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-color:#06070a;
  background-image:
    radial-gradient(1100px 650px at 85% -5%, rgba(234, 181, 78, 0.08), transparent 70%),
    radial-gradient(950px 750px at 10% 25%, rgba(143, 124, 232, 0.09), transparent 70%),
    radial-gradient(900px 600px at 50% 85%, rgba(23, 28, 42, 0.5), transparent 80%),
    linear-gradient(180deg, rgba(6, 7, 10, 0.3) 0%, rgba(6, 7, 10, 0.95) 100%);
}

a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px;position:relative;z-index:1}

/* Kompaktes Menüband */
.top-wrap{position:sticky;top:10px;z-index:60;max-width:1160px;margin:10px auto 0;padding:0 20px}
.top{background:rgba(15,17,22,.92);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--line2);border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.55)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;padding:0 12px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand .mark{width:36px;height:36px;flex-shrink:0;border-radius:8px;object-fit:cover}
.brand b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
.brand b span.brand-gold{color:var(--amber)}
.brand span.brand-sub{display:block;font-size:10px;color:var(--tx3);letter-spacing:.6px;font-weight:600;margin-top:1px}

nav{display:flex;gap:2px;align-items:center;flex-shrink:1;min-width:0}
nav a{padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--tx2);white-space:nowrap;transition:.14s}
nav a:hover{color:var(--tx);background:var(--panel2)}
nav a.on{color:var(--tx);background:var(--panel3);box-shadow:inset 0 0 0 1px var(--line2)}

.top-r{display:flex;align-items:center;gap:6px;flex-shrink:0}
.sbtn{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--tx3);font-size:12px;transition:.14s}
.sbtn:hover{border-color:var(--line2);color:var(--tx2)}
kbd{font-family:var(--mono);font-size:10px;padding:2px 4px;border-radius:4px;background:#1b202a;border:1px solid #2b3242;color:var(--tx3)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;transition:.14s;border:1px solid transparent;white-space:nowrap}
.btn-p{background:var(--amber);color:#1a1305}
.btn-p:hover{background:#f2c266}
.btn-disc{background:var(--disc-bg);color:#7289da;border-color:rgba(88,101,242,.35)}
.btn-disc:hover{background:#5865f2;color:#fff;border-color:#5865f2}

.notice-bar{max-width:1160px;margin:8px auto 0;padding:0 20px}
.notice{background:var(--green-bg);border:1px solid rgba(94,196,143,.25);font-size:12px;color:var(--green);text-align:center;padding:6px 20px;border-radius:10px}
main{padding:18px 0 90px}

.page-h{margin-bottom:24px}
.page-h h1{font-size:29px;font-weight:700;letter-spacing:-.8px;line-height:1.15}
.page-h p{font-size:14.5px;color:var(--tx2);margin-top:6px;max-width:680px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx3);margin-bottom:10px}
h2.sec{font-size:19px;font-weight:650;letter-spacing:-.4px;margin-bottom:4px}
.sec-sub{font-size:13.5px;color:var(--tx3);margin-bottom:16px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.start-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:16px;align-items:stretch;margin-bottom:34px}
.muted{color:var(--tx3)}.soft{color:var(--tx2)}
.mono{font-family:var(--mono);font-size:12.5px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.3px;padding:3px 9px;border-radius:100px;border:1px solid}
.p-green{color:var(--green);border-color:rgba(94,196,143,.3);background:var(--green-bg)}
.p-amber{color:var(--amber);border-color:rgba(234,181,78,.32);background:var(--amber-bg)}
.p-violet{color:var(--violet);border-color:rgba(143,124,232,.32);background:var(--violet-bg)}
.p-blue{color:var(--blue);border-color:rgba(107,156,232,.3);background:var(--blue-bg)}
.p-gray{color:var(--tx3);border-color:var(--line2);background:var(--panel2)}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor}

/* Hero Section mit neuem Logo */
.hero{border:1px solid var(--line2);border-radius:20px;overflow:hidden;background:linear-gradient(145deg,#171b26 0%,#10131a 52%,#0b0d12 100%);position:relative;margin-bottom:16px;box-shadow:0 20px 48px rgba(0,0,0,.45)}
.hero::after{content:"";position:absolute;right:-120px;top:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(234,181,78,.16),transparent 66%);pointer-events:none}
.hero-in{padding:36px;position:relative;z-index:1;display:flex;gap:36px;align-items:center;flex-wrap:wrap}
.hero-mark{width:124px;height:124px;flex-shrink:0;border-radius:24px;object-fit:cover;filter:drop-shadow(0 14px 30px rgba(0,0,0,.85))}
.hero-text{flex:1;min-width:280px}
.hero h1{font-size:56px;font-weight:900;letter-spacing:-2px;line-height:1.02;margin-bottom:10px;color:#eaedf3}
.hero h1 span.hero-gold{color:var(--amber);text-shadow:0 0 28px rgba(234,181,78,.45)}
.hero .sub{font-size:15px;color:var(--tx2);max-width:580px;line-height:1.55}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{font-size:12px;padding:5px 12px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line2);color:var(--tx2)}
.chip b{color:var(--tx);font-weight:650}

.progblock{margin-top:20px;padding-top:20px;border-top:1px solid var(--line);width:100%}
.progrow{display:flex;align-items:center;gap:14px;margin-bottom:9px}
.progrow:last-child{margin-bottom:0}
.progrow .lbl{width:78px;flex-shrink:0;font-size:12px;font-weight:650;color:var(--tx2)}
.track{flex:1;height:8px;border-radius:100px;background:#1a1e28;overflow:hidden;min-width:80px}
.fill{display:block;height:100%;border-radius:100px}
.progrow .val{width:66px;text-align:right;flex-shrink:0;font-family:var(--mono);font-size:12px;color:var(--tx)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{display:block;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:13px;transition:.16s}
.tile:hover{border-color:var(--line2);background:var(--panel2);transform:translateY(-2px)}
.tile .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--panel3);border:1px solid var(--line2);font-size:16px;margin-bottom:12px}
.tile b{display:block;font-size:14px;font-weight:650;margin-bottom:3px}
.tile span{display:block;font-size:12.5px;color:var(--tx3);line-height:1.45}

/* Boss & Dungeon Cards */
.boss{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden;transition:.2s ease;position:relative}
.boss:hover{border-color:var(--line2);transform:translateY(-1px)}
.boss.open{border-color:rgba(234,181,78,.4);background:var(--panel2)}

.bhead{
  display:flex;align-items:center;gap:16px;padding:20px 24px;width:100%;position:relative;overflow:hidden;min-height:92px;cursor:pointer;background-size:cover;background-position:right 10% center;background-repeat:no-repeat;
}
.bhead::before{
  content:"";position:absolute;inset:0;background:linear-gradient(90deg, #11141b 0%, rgba(17,20,27,0.94) 35%, rgba(17,20,27,0.55) 65%, rgba(17,20,27,0.85) 100%),linear-gradient(180deg, rgba(17,20,27,0.1) 0%, rgba(17,20,27,0.7) 100%);z-index:1;pointer-events:none;
}
.boss.open .bhead::before{
  background:linear-gradient(90deg, #161a23 0%, rgba(22,26,35,0.94) 35%, rgba(22,26,35,0.45) 65%, rgba(22,26,35,0.85) 100%),linear-gradient(180deg, rgba(22,26,35,0.1) 0%, rgba(22,26,35,0.8) 100%);
}
.bhead > *{ position:relative; z-index:2; }

.bnum{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;font-family:var(--mono);font-size:14px;font-weight:700;background:rgba(15,17,22,0.85);backdrop-filter:blur(8px);border:1px solid var(--line2);color:var(--tx2);
}
.boss.open .bnum{ background:var(--amber);color:#1a1305;border-color:var(--amber);box-shadow:0 0 14px rgba(234,181,78,0.4); }
.bname{flex:1;min-width:0}
.bname b{ display:block;font-size:18px;font-weight:800;letter-spacing:-.3px;color:var(--tx);text-shadow:0 2px 8px rgba(0,0,0,0.8); }
.bname span{ display:block;font-size:13px;color:var(--tx2);margin-top:2px;text-shadow:0 1px 4px rgba(0,0,0,0.8); }
.chev{color:var(--tx3);transition:.2s;flex-shrink:0}
.boss.open .chev{transform:rotate(180deg)}
.bbody{display:none;padding:16px 24px 26px}
.boss.open .bbody{display:block}

.quick-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:18px}
.meta-box{background:var(--panel3);border:1px solid var(--line);border-radius:9px;padding:10px 14px}
.meta-box span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);font-weight:700}
.meta-box b{display:block;font-size:13.5px;color:var(--tx);margin-top:2px}

.bintro{font-size:14px;color:var(--tx2);padding:14px 18px;background:rgba(255,255,255,.02);border-left:3px solid var(--amber);border-radius:0 10px 10px 0;margin-bottom:20px;line-height:1.6}

/* Difficulty Tabs */
.diff-bar{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.diff-tab{padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--tx3);background:var(--panel3);border:1px solid var(--line);cursor:pointer;transition:.14s}
.diff-tab:hover{color:var(--tx);border-color:var(--line2)}
.diff-tab.active{color:#1a1305;background:var(--amber);border-color:var(--amber)}

.roles-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
.role-box{background:var(--panel3);border:1px solid var(--line2);border-radius:11px;padding:14px 16px}
.role-box-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.role-box ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.role-box li{font-size:13px;color:var(--tx2);line-height:1.5;position:relative;padding-left:14px}
.role-box li::before{content:"•";position:absolute;left:0;color:var(--tx3)}

.phase-card{background:#0e1118;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.phase-card-h{padding:12px 16px;background:#141720;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.phase-card-h b{font-size:14px;font-weight:700}
.phase-card-h span{font-size:12.5px;color:var(--tx3)}
.phase-card-b{padding:14px 16px;display:flex;flex-direction:column;gap:10px}

.mech-card{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:12px 14px}
.mech-card-t{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.mech-card-t b{font-size:13.5px;color:var(--tx)}
.mech-card-desc{font-size:13px;color:var(--tx2);margin-bottom:6px;line-height:1.5}
.mech-card-sol{font-size:12.5px;color:#9cdba8;background:rgba(94,196,143,.08);padding:6px 10px;border-radius:6px;border-left:2px solid var(--green)}

.hazard-box{background:rgba(226,107,107,.06);border:1px solid rgba(226,107,107,.25);border-radius:11px;padding:14px 16px;margin:20px 0}
.hazard-box h4{font-size:12.5px;text-transform:uppercase;letter-spacing:1px;color:var(--red);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.hazard-box ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.hazard-box li{font-size:13px;color:var(--tx2);line-height:1.5;padding-left:14px;position:relative}
.hazard-box li::before{content:"✕";position:absolute;left:0;color:var(--red);font-size:11px}

.rtag{flex-shrink:0;width:58px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.4px;padding:3px 0;border-radius:6px;text-transform:uppercase}
.r-alle{background:var(--panel2);color:var(--tx3);border:1px solid var(--line2)}
.r-tanks{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(107,156,232,.28)}
.r-heiler{background:var(--green-bg);color:var(--green);border:1px solid rgba(94,196,143,.28)}
.r-dps,.r-melee{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(234,181,78,.28)}
.r-ranged{background:var(--violet-bg);color:var(--violet);border:1px solid rgba(143,124,232,.28)}

.tag-toedlich{color:#ff6b6b;background:rgba(226,107,107,.15);border:1px solid rgba(226,107,107,.35);padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase}
.tag-prio{color:#f5cd72;background:rgba(234,181,78,.15);border:1px solid rgba(234,181,78,.35);padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase}
.tag-heilung{color:#5ec48f;background:rgba(94,196,143,.15);border:1px solid rgba(94,196,143,.35);padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase}
.tag-mechanik{color:#6b9ce8;background:rgba(107,156,232,.15);border:1px solid rgba(107,156,232,.35);padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase}

/* M+ Specific Dungeon Grid & Tabs */
.d-selector{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:24px}
.d-btn{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);transition:.16s;cursor:pointer}
.d-btn:hover{background:var(--panel2);border-color:var(--line2)}
.d-btn.active{background:var(--panel3);border-color:var(--amber);box-shadow:0 0 16px rgba(234,181,78,.15)}
.d-btn .ic{font-size:22px;flex-shrink:0}
.d-btn b{display:block;font-size:13.5px;font-weight:700}
.d-btn span{display:block;font-size:11.5px;color:var(--tx3)}

.trash-table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0 24px}
.trash-table th{background:var(--panel3);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);padding:10px 12px;border-bottom:1px solid var(--line2)}
.trash-table td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--tx2);vertical-align:top}
.trash-table tr:hover td{background:rgba(255,255,255,.02)}

.badge-kick{color:#ff6b6b;background:rgba(226,107,107,.15);border:1px solid rgba(226,107,107,.35);padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase}
.badge-stop{color:#f5cd72;background:rgba(234,181,78,.15);border:1px solid rgba(234,181,78,.35);padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase}
.badge-dispel{color:#5ec48f;background:rgba(94,196,143,.15);border:1px solid rgba(94,196,143,.35);padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase}
.badge-frontal{color:#6b9ce8;background:rgba(107,156,232,.15);border:1px solid rgba(107,156,232,.35);padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase}

.abils{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.abil{font-size:12px;padding:4px 10px;border-radius:7px;background:#1a1f29;border:1px solid var(--line2);color:var(--tx2);transition:.14s}
.abil:hover{border-color:var(--amber);color:var(--tx)}
.links{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.lchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:550;padding:7px 12px;border-radius:9px;background:#1a1f29;border:1px solid var(--line2);color:var(--tx2);transition:.14s}
.lchip:hover{border-color:#3d4658;color:var(--tx);background:#20262f}

/* Tracker, Table, Signups, Logs, Roster, Wissen */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table.trk{width:100%;border-collapse:collapse;font-size:13px;min-width:680px}
table.trk th{position:sticky;top:0;background:var(--panel2);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);font-weight:700;padding:12px 11px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
table.trk th:hover{color:var(--tx2)}
table.trk th.act{color:var(--amber)}
table.trk th .ar{opacity:.5;font-size:9px;margin-left:3px}
table.trk td{padding:11px 11px;border-bottom:1px solid var(--line);color:var(--tx2);white-space:nowrap}
table.trk tr:last-child td{border-bottom:none}
table.trk tbody tr:hover td{background:rgba(255,255,255,.02)}
.pname{display:flex;align-items:center;gap:9px}
.pdot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.pname b{color:var(--tx);font-weight:650;font-size:13px}
.pname i{font-style:normal;font-size:11px;color:var(--tx3);display:block}
.num{font-family:var(--mono);font-size:12.5px;color:var(--tx)}
.mini{height:6px;border-radius:100px;background:#1a1e28;overflow:hidden;width:60px;display:inline-block;vertical-align:middle;margin-right:8px}
.mini i{display:block;height:100%;border-radius:100px}
.vault{display:inline-flex;gap:4px}
.vslot{width:16px;height:16px;border-radius:4px;border:1px solid var(--line2);background:#171b24}
.vslot.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 8px rgba(234,181,78,.3)}

.rank{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;background:var(--panel);border:1px solid var(--line);margin-bottom:6px;transition:.14s}
.rank:hover{border-color:var(--line2)}
.rank .pos{width:22px;font-family:var(--mono);font-size:12px;color:var(--tx3);flex-shrink:0;text-align:right}
.rank .nm{flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rank .vl{font-family:var(--mono);font-size:12.5px;color:var(--tx);flex-shrink:0}
.rank.top .pos{color:var(--amber);font-weight:700}

.sig-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)}

function route(){
  try {
    const k = location.hash.replace("#/","") || "start";
    document.getElementById("view").innerHTML = (views[k] || views.start)();
    document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.k === k));
    document.querySelectorAll(".kk").forEach(e => e.textContent = KEY);
    if(k === "tracker") bindTrk();
    if(window.$WowheadPower) window.$WowheadPower.refreshLinks();
  } catch (e) {
    console.error("Route error:", e);
  }
}
addEventListener("hashchange", route);

let INDEX = [];
function buildIndex(){
  INDEX = [
    ...DUNGEONS.flatMap((d,i) => [
      {i:d.icon||"🗝️", t:d.name, s:`M+ Dungeon · Timer ${d.timer}`, c:"Dungeon", h:"#/dungeons", k:`${d.name} ${d.nameEn} mythic plus dungeon`},
      ...(d.trash||[]).map(t => ({i:"⚔️", t:t.name, s:`${t.ability} (${d.name})`, c:"Trash", h:"#/dungeons", k:`${t.name} ${t.ability} ${d.name}`}))
    ]),
    ...BOSSES.flatMap((b,i) => [
      {i:"🎯", t:b.n, s:`Raid Boss ${i+1} · ${b.role}`, c:"Boss", h:"#/raid", k:`${b.n} ${b.en} boss`}
    ]),
    ...KADER.map(p => ({i:"👤", t:p.n, s:`${p.c} · ${p.r}`, c:"Kader", h:"#/roster", k:`${p.n} ${p.c} ${p.r} raider`})),
    ...KB.map(k => ({i:k.i, t:k.t, s:k.d, c:"Wissen", h:"#/wissen", k:`${k.t} ${k.d}`}))
  ];
}

const ovl = document.getElementById("ovl"), q = document.getElementById("q"), rb = document.getElementById("results");
let sel = 0, hits = [];
function openS(){ ovl.classList.add("on"); q.value = ""; q.focus(); draw(""); }
function closeS(){ ovl.classList.remove("on"); }
document.getElementById("openS").onclick = openS;
ovl.onclick = e => { if(e.target === ovl) closeS(); };
function draw(term){
  const t = term.trim().toLowerCase();
  hits = !t ? INDEX.slice(0,6) : INDEX.filter(x => x.k.toLowerCase().includes(t)).slice(0,16);
  sel = 0;
  if(!hits.length){ rb.innerHTML = `<div class="empty">Nichts gefunden für „${esc(term)}“.</div>`; return; }
  rb.innerHTML = (!t ? `<div class="eyebrow" style="padding:9px 12px 4px;margin:0">Schnellsuche</div>` : "") +
    hits.map((h,i) => `<div class="res${i===0?' sel':''}" data-i="${i}">
      <span class="ic">${h.i}</span>
      <span class="tx"><b>${esc(h.t)}</b><span>${esc(h.s)}</span></span>
      <span class="cat">${h.c}</span></div>`).join("");
  rb.querySelectorAll(".res").forEach(el => el.onclick = () => go(+el.dataset.i));
}
function go(i){ if(!hits[i]) return; location.hash = hits[i].h; closeS(); }
function move(d){ if(!hits.length) return; sel = (sel + d + hits.length) % hits.length;
  rb.querySelectorAll(".res").forEach((el,i) => el.classList.toggle("sel", i === sel));
  const c = rb.querySelector(".res.sel"); if(c) c.scrollIntoView({block:"nearest"}); }
q.addEventListener("input", e => draw(e.target.value));
addEventListener("keydown", e => {
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); ovl.classList.contains("on") ? closeS() : openS(); return; }
  if(!ovl.classList.contains("on")) return;
  if(e.key === "Escape") closeS();
  else if(e.key === "ArrowDown"){ e.preventDefault(); move(1); }
  else if(e.key === "ArrowUp"){ e.preventDefault(); move(-1); }
  else if(e.key === "Enter"){ e.preventDefault(); go(sel); }
});

(async function boot(){
  buildIndex();
  route();
  
  try {
    const [d, c] = await Promise.all([
      Promise.all(["guild","roster","events","logs","wowaudit","blizzard","status"].map(n => load(`data/${n}.json`)))
        .then(a => Object.fromEntries(["guild","roster","events","logs","wowaudit","blizzard","status"].map((n,i) => [n,a[i]]))),
      Promise.all(["bosses","wissen","raider","termine","dungeons"].map(n => load(`content/${n}.json`)))
        .then(a => Object.fromEntries(["bosses","wissen","raider","termine","dungeons"].map((n,i) => [n,a[i]])))
    ]);
    applyData(d, c);
  } catch(e) {
    console.warn("Dynamic data loading skipped, using defaults:", e);
  }
  buildIndex();
  route();
})();
