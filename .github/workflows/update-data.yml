name: Daten aktualisieren

on:
  schedule:
    - cron: '20 5 * * *'
    - cron: '20 11 * * *'
    - cron: '20 17 * * *'
    - cron: '40 23 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'content/raider.json'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Daten holen
        run: node scripts/update.mjs
        env:
          GUILD_REGION: eu
          GUILD_REALM: blackmoore
          GUILD_NAME: ShadowFox
          RAIDHELPER_API_KEY:      ${{ secrets.RAIDHELPER_API_KEY }}
          RAIDHELPER_SERVER_ID:    ${{ secrets.RAIDHELPER_SERVER_ID }}
          WCL_CLIENT_ID:           ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET:       ${{ secrets.WCL_CLIENT_SECRET }}
          WOWAUDIT_API_KEY:        ${{ secrets.WOWAUDIT_API_KEY }}
          BLIZZARD_CLIENT_ID:      ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET:  ${{ secrets.BLIZZARD_CLIENT_SECRET }}

      - name: Aenderungen zurueckschreiben
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Keine Aenderungen — nichts zu committen."
          else
            git commit -m "Daten automatisch aktualisiert"
            git push
          fi
